name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in version.json
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch or tag: a newer push replaces a run that is still going.
# A run that may be publishing a release is never cancelled.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' && vars.AUTO_RELEASE != 'true' }}

env:
  # The Cherri compiler commit UMDL is verified against.
  CHERRI_REF: 98d5191ae121a6bcf663ed0e55495f4ee4c7a6e2
  SIGNING_API: https://sign.shortcuty.app/api/v1/sign

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install the Cherri compiler
        run: go install "github.com/electrikmilk/cherri@${CHERRI_REF}"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile the shortcut (unsigned)
        run: cherri src/UMDL.cherri --skip-sign --debug --no-ansi > compile.log || (cat compile.log; exit 1)
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Test the signed-file checker
        working-directory: tools/verifysigned
        run: go test ./...
      - uses: actions/upload-artifact@v7
        with:
          name: UMDL-unsigned
          path: src/UMDL_unsigned.shortcut
          if-no-files-found: error

  sign:
    name: Sign
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.result.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: UMDL-unsigned
          path: src
      - name: Sign with the Shortcuty signing service
        # Free, no account. See docs/BUILDING.md for what this service is.
        run: |
          mkdir -p dist
          status=$(curl --show-error --silent --max-time 180 \
            --user-agent "UMDL-CI (+https://github.com/${GITHUB_REPOSITORY})" \
            --form 'file=@src/UMDL_unsigned.shortcut;filename=UMDL.shortcut' \
            --dump-header dist/headers.txt --output dist/response.bin \
            --write-out '%{http_code}' "$SIGNING_API" || true)
          if [ "$status" = "200" ] && [ "$(head -c 4 dist/response.bin)" = "AEA1" ]; then
            mv dist/response.bin dist/UMDL.shortcut
            echo "Signed by the Shortcuty service."
          else
            echo "::warning::The Shortcuty signing service answered ${status:-nothing} and did not sign the shortcut."
            grep -i -E '^(HTTP|server|content-type|cf-|retry-after|x-)' dist/headers.txt || true
            head -c 600 dist/response.bin | tr -c '[:print:]\n' '.' || true
            rm -f dist/response.bin
          fi
      - name: Sign with RoutineHub instead, if that did not work
        env:
          ROUTINEHUB_API_KEY: ${{ secrets.ROUTINEHUB_API_KEY }}
        run: |
          if [ -s dist/UMDL.shortcut ]; then echo "Already signed."; exit 0; fi
          if [ -z "$ROUTINEHUB_API_KEY" ]; then echo "No ROUTINEHUB_API_KEY secret; skipping."; exit 0; fi
          go install "github.com/electrikmilk/cherri@${CHERRI_REF}"
          cherri src/UMDL.cherri --hubsign --routinehub-api-key="$ROUTINEHUB_API_KEY" --output=dist/UMDL.shortcut --no-ansi \
            || echo "::warning::RoutineHub refused to sign. A 401 means the key is wrong or the account has no Developer membership, which HubSign requires."
      - name: Check that the signed file holds exactly what was built
        id: result
        run: |
          if [ ! -s dist/UMDL.shortcut ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "The shortcut compiled but could not be signed. See docs/BUILDING.md for the ways to sign it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd tools/verifysigned && go run . ../../src/UMDL_unsigned.shortcut ../../dist/UMDL.shortcut)
          echo "signed=true" >> "$GITHUB_OUTPUT"
          {
            echo "Signed \`UMDL.shortcut\` is attached to this run as the **UMDL** artifact."
            echo
            echo "SHA-256: \`$(sha256sum dist/UMDL.shortcut | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.signed == 'true'
        with:
          name: UMDL
          path: dist/UMDL.shortcut

  release:
    name: Release
    needs: sign
    # Runs for a v* tag, when the workflow is started by hand on main with "Publish a release" ticked,
    # or for a push to main when the repository variable AUTO_RELEASE is "true".
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release)
      || (github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AUTO_RELEASE == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("version.json"))["shortcut"])')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.json ($tag)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # An ordinary push never replaces the file of a version that is already released.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released, so this push published nothing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop if there is no signed shortcut
        if: steps.tag.outputs.publish == 'true' && needs.sign.outputs.signed != 'true'
        run: |
          echo "No signed shortcut was built, so nothing was published. See docs/BUILDING.md." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.publish == 'true'
        with:
          name: UMDL
          path: dist
      - name: Publish the release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "UMDL ${TAG#v}" --notes-file .github/release-notes.md
          elif [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/UMDL.shortcut --clobber
          echo "Published $TAG: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
